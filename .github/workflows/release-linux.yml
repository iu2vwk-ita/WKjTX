name: Attach Linux Release Assets

# After Build Linux succeeds on a tag, append the Linux packages
# (.tar.gz / .deb / .rpm) to the same draft GitHub Release that the
# Windows release.yml workflow created. The human (release manager)
# publishes the draft after reviewing both Windows and Linux artifacts.

on:
  workflow_run:
    workflows: ["Build Linux"]
    types: [completed]

jobs:
  release:
    name: Attach Linux assets
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Linux packages artifact
        uses: actions/download-artifact@v4
        with:
          name: wkjtx-linux-packages
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: linux/

      - name: Compute SHA-256 of Linux packages
        run: |
          cd linux
          sha256sum * > SHA256SUMS-linux.txt || true
          cat SHA256SUMS-linux.txt

      - name: Append to existing draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.workflow_run.head_branch }}
          draft: true
          generate_release_notes: false
          append_body: true
          files: |
            linux/wkjtx*.tar.gz
            linux/wkjtx*.deb
            linux/wkjtx*.rpm
            linux/SHA256SUMS-linux.txt
